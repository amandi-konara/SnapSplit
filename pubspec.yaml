name: snapsplit
description: "SnapSplit - scan a receipt and split the bill (Group 51, University of Ruhuna)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_fonts: ^6.3.3 # 9.x needs the new material_ui package; stay on 6.x
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.2.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
